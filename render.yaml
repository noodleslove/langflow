services:
  # A Docker web service
  - type: web
    name: langflow
    runtime: docker
    dockerfilePath: ./docker/cdk.Dockerfile
    repo: https://github.com/noodleslove/langflow
    branch: dev
    plan: standard
    healthCheckPath: /health_check
    autoDeploy: false
    envVars:
      - key: LANGFLOW_DATABASE_URL
        fromDatabase:
          name: langflow-db
          property: connectionString
      - key: LANGFLOW_HOST
        value: 0.0.0.0
      - key: LANGFLOW_PORT
        # default render port https://docs.render.com/web-services#port-binding
        value: 10000
      - key: LANGFLOW_LOG_LEVEL
        value: INFO
      - key: LANGFLOW_OPEN_BROWSER
        value: false
      - key: LANGFLOW_REMOVE_API_KEYS
        value: true
      - key: LANGFLOW_AUTO_LOGIN
        value: false
      - key: LANGFLOW_SUPERUSER
        sync: false
      - key: LANGFLOW_SUPERUSER_PASSWORD
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
    disk:
      name: langflow-data
      mountPath: /app/data
databases:
  - name: langflow-db
    plan: basic-256mb
    databaseName: langflow
    user: langflow
